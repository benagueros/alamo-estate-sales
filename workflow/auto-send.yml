# Auto-send — Alamo Estate Deals
#
# Publishes today's Buttondown draft after a review window, so the letter
# goes out without Ben's input but he always has time to adjust.
#
# How it works:
# - "Build daily issue" creates a Buttondown draft + writes
#   drafts/manifest-YYYY-MM-DD.json (email_id, created_at, verified_finds, sent).
# - This workflow polls hourly. It sends only when ALL hold (see
#   pipeline/auto_send.py): the draft is still a draft in Buttondown,
#   it is at least 4 hours old (Ben's adjustment window), it is less than
#   24h old (no stale drafts), and verified_finds >= 1 (hard rule: never
#   auto-send a 0-verified draft).
# - Ben's controls: edit the draft in Buttondown (auto-send ships his
#   edit); delete the draft in Buttondown (auto-send treats the 404 as
#   cancelled and skips). If the draft is too fresh, this run skips and a
#   later hourly run sends it.
# - If verified_finds == 0, this draft NEVER auto-sends; Ben decides
#   manually (the manual "Send issue" workflow still exists as fallback).
#
# Ben adds this file via the GitHub web UI (the GitHub integration cannot
# push .github/workflows/** files).
#
# Required repo secret: BUTTONDOWN_API_KEY.

name: Auto-send issue

on:
  schedule:
    - cron: "0 * * * *"   # hourly; auto_send.py no-ops when nothing is due
  workflow_dispatch:

# The manifest-update step pushes back to the repo.
permissions:
  contents: write

jobs:
  auto-send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send due drafts (oldest first, at most one)
        # Loop manifests oldest-first (filename date, not checkout mtime —
        # ls -t is unreliable in a fresh checkout where all files share a
        # checkout timestamp). Send at most one per run: stop after the first
        # successful send (exit 2). Older due drafts are not starved by newer
        # ones — a still-due older draft sends before a newer one is tried.
        # Bash -e guard: GitHub Actions runs bash with errexit, so a
        # non-zero exit from auto_send.py would abort the script before
        # CODE is captured. The `|| CODE=$?` guard prevents that.
        # Error visibility: if no draft sends but some manifests errored
        # (exit 1 = transient API failure or bad manifest), fail the run so
        # the errors are visible instead of silently swallowed.
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          SENT=0
          ERRORS=0
          for MANIFEST in $(ls drafts/manifest-*.json 2>/dev/null | sort); do
            echo "Checking manifest: $MANIFEST"
            CODE=0
            python3 pipeline/auto_send.py "$MANIFEST" || CODE=$?
            if [ $CODE -eq 2 ]; then
              echo "Sent $MANIFEST — stopping (one send per run)."
              SENT=1
              break
            elif [ $CODE -eq 1 ]; then
              echo "Manifest $MANIFEST errored (transient or bad manifest) — continuing to next."
              ERRORS=$((ERRORS + 1))
            fi
            # Exit 0 = skipped (not due, already sent, 0-verified, etc.)
          done
          if [ $SENT -eq 1 ]; then
            echo "Draft sent this run."
          elif [ $ERRORS -gt 0 ]; then
            echo "ERROR: $ERRORS manifest(s) errored and none sent — failing run for visibility."
            exit 1
          else
            echo "No draft sent this run (none due)."
          fi

      - name: Commit manifest updates
        # Records sent/cancelled flags so later runs skip those drafts.
        # Commit ALL manifests (the loop may have updated several).
        # Best-effort: Buttondown's email status is the source of truth, so
        # a failed commit can't cause a double-send (next run re-checks it).
        # Glob guard: if no manifests exist, `git add` with an unexpanded
        # glob fails under bash -e — skip cleanly instead.
        run: |
          git config user.name "alamo-bot"
          git config user.email "alamo-bot@users.noreply.github.com"
          shopt -s nullglob
          MANIFESTS=(drafts/manifest-*.json)
          if [ ${#MANIFESTS[@]} -eq 0 ]; then
            echo "No manifests to commit."
            exit 0
          fi
          git add "${MANIFESTS[@]}"
          git diff --cached --quiet || git commit -m "auto-send: manifest updates"
          git push || echo "manifest push failed (non-fatal)"
