# Comp check — Alamo Estate Deals
#
# Manual dispatch: Actions -> "Comp check" -> Run workflow.
# Ben adds this file via the GitHub web UI (the GitHub integration cannot
# push .github/workflows/** files).
#
# Required repo secret: TRAWL_API_KEY (the trawl.dev key).
# Repo files: comps.py, finds.json (one entry per newsletter find).

name: Comp check

on:
  workflow_dispatch:
    inputs:
      finds_file:
        description: "Finds file in the repo (default finds.json)"
        required: false
        default: "finds.json"
      verify:
        description: "Run sold-state verification (/item per comp, ~1 credit each, max 10)"
        required: false
        default: "true"

jobs:
  comps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch sold comps
        env:
          TRAWL_API_KEY: ${{ secrets.TRAWL_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.verify }}" = "true" ]; then ARGS="--verify"; fi
          python3 comps.py "${{ inputs.finds_file }}" $ARGS --out out

      - name: Record credits spent
        # Comp-check runs are manual, but they spend real trawl credits —
        # without this step the monthly guard (state.json) would undercount
        # and the daily build could overshoot the 250 free cap. Same snippet
        # as build-issue.yml.
        run: |
          python3 - <<'EOF'
          import json, datetime
          month = datetime.date.today().strftime("%Y-%m")
          try:
              state = json.load(open("state.json"))
          except (FileNotFoundError, json.JSONDecodeError):
              state = {}
          if state.get("trawl_month") != month:
              state = {"trawl_month": month, "trawl_credits_used": 0}
          brief = json.load(open("out/comp-brief.json"))
          state["trawl_credits_used"] += brief.get("credits_charged", 0)
          json.dump(state, open("state.json", "w"), indent=2)
          print(f"comp-check spent {brief.get('credits_charged', 0)} credits; "
                f"month total now: {state['trawl_credits_used']}")
          EOF
          git config user.name "alamo-bot"
          git config user.email "alamo-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "comp-check: record trawl credits"
          git push

      - name: Upload brief
        uses: actions/upload-artifact@v4
        with:
          name: comp-brief
          path: |
            out/comp-brief.json
            out/comp-brief.md

      - name: Brief summary
        run: cat out/comp-brief.md >> "$GITHUB_STEP_SUMMARY"
