# Build daily issue — Alamo Estate Deals
#
# Runs every morning: scrape SA listings -> identify candidates ->
# trawl.dev sold comps -> assemble the draft issue -> commit it ->
# create a Buttondown DRAFT (not sent) for Ben's review.
# The "Auto-send" workflow publishes the draft after a review window
# (see workflow/auto-send.yml). Ben can edit the Buttondown draft
# (auto-send ships his edit) or delete it (auto-send skips).
#
# Ben adds this file via the GitHub web UI (the GitHub integration cannot
# push .github/workflows/** files).
#
# Required repo secrets: TRAWL_API_KEY, BUTTONDOWN_API_KEY.
# Repo files: pipeline/*.py, comps.py (trawl's API is not reliably reachable
# from the Hatch VM, so comps run here on Actions, not on the VM).

name: Build daily issue

on:
  schedule:
    - cron: "0 11 * * *"   # ~6:00am CDT
  workflow_dispatch:

# The "Commit draft" step pushes the issue draft back to the repo.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        # Playwright: the site is Angular/client-rendered (plain HTTP gets
        # only the app shell), so the scraper drives headless Chromium.
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Scrape SA listings
        # Metro page discovery (SaleEvent JSON-LD) + Playwright detail pages.
        # Detail pages are capped at 25 in scrape.py; total runtime ~10 min.
        run: python3 pipeline/scrape.py --out sales.json

      - name: Identify candidates (keywords)
        run: python3 pipeline/identify.py sales.json --out finds_kw.json --max-finds 4

      - name: Identify candidates (vision)
        # Gemini Flash over listing photos: brand + MODEL, not just brand.
        # Needs repo secret GEMINI_API_KEY (free AI Studio key). Without it
        # the step skips gracefully and keyword finds carry the issue.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 pipeline/vision.py sales.json --merge finds_kw.json --out finds.json --max-finds 4

      - name: Check trawl credit budget
        id: budget
        run: |
          python3 - <<'EOF'
          import json, datetime, os
          month = datetime.date.today().strftime("%Y-%m")
          try:
              state = json.load(open("state.json"))
          except (FileNotFoundError, json.JSONDecodeError):
              state = {}
          used = state.get("trawl_credits_used", 0) if state.get("trawl_month") == month else 0
          ok = used < 200  # free tier = 250/mo; 200 guard leaves headroom
          print(f"trawl month={month} used={used} ok={ok}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"ok={'true' if ok else 'false'}\n")
          if not ok:
              # Guard tripped: write an empty brief so "Assemble issue draft"
              # renders its n=0 path instead of crashing on a missing file.
              # The draft still commits; Ben's writer pass sees the gap.
              os.makedirs("out", exist_ok=True)
              json.dump({"credits_charged": 0, "summaries": [],
                         "verifications": [], "budget_skipped": True},
                        open("out/comp-brief.json", "w"), indent=2)
              print("budget guard tripped: wrote empty out/comp-brief.json")
          EOF

      - name: Fetch sold comps
        if: steps.budget.outputs.ok == 'true'
        env:
          TRAWL_API_KEY: ${{ secrets.TRAWL_API_KEY }}
        run: |
          python3 comps.py finds.json --verify --verify-cap 4 --out out
          python3 - <<'EOF'
          import json, datetime
          month = datetime.date.today().strftime("%Y-%m")
          try:
              state = json.load(open("state.json"))
          except (FileNotFoundError, json.JSONDecodeError):
              state = {}
          if state.get("trawl_month") != month:
              state = {"trawl_month": month, "trawl_credits_used": 0}
          brief = json.load(open("out/comp-brief.json"))
          state["trawl_credits_used"] += brief.get("credits_charged", 0)
          json.dump(state, open("state.json", "w"), indent=2)
          print(f"month credits used now: {state['trawl_credits_used']}")
          EOF

      - name: Assemble issue draft
        run: python3 pipeline/issue.py sales.json finds.json out/comp-brief.json

      - name: Create Buttondown draft
        # The draft goes to Buttondown immediately so Ben can review/edit
        # it in the dashboard. The "Auto-send" workflow publishes it after
        # a review window (see workflow/auto-send.yml) — nothing sends here.
        # Manifest is per-date so a re-run never clobbers an earlier draft's
        # tracking.
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: |
          MANIFEST="drafts/manifest-$(date +%F).json"
          if [ -f "$MANIFEST" ]; then
            # Same-date re-run: back up the earlier manifest so its draft ID
            # isn't lost (the earlier Buttondown draft still exists).
            # Seconds resolution: two re-runs in the same minute are rare,
            # and the backup is best-effort record-keeping anyway.
            mv "$MANIFEST" "drafts/manifest-$(date +%F-%H%M%S).json"
          fi
          python3 pipeline/send.py "drafts/$(date +%F).html" --manifest "$MANIFEST"
          python3 - <<'EOF'
          import json
          # Attach the verified-find count so auto-send knows whether this
          # draft is eligible (hard rule: never auto-send 0-verified).
          brief = json.load(open("out/comp-brief.json"))
          verified = sum(1 for s in brief.get("summaries", [])
                         if (s.get("verification") or {}).get("passed"))
          import datetime
          manifest_path = f"drafts/manifest-{datetime.date.today().isoformat()}.json"
          manifest = json.load(open(manifest_path))
          manifest["verified_finds"] = verified
          manifest["total_finds"] = len(brief.get("summaries", []))
          json.dump(manifest, open(manifest_path, "w"), indent=2)
          print(f"draft {manifest['email_id']}: "
                f"{verified}/{manifest['total_finds']} finds verified")
          EOF

      - name: Commit draft
        run: |
          git config user.name "alamo-bot"
          git config user.email "alamo-bot@users.noreply.github.com"
          git add drafts state.json
          git diff --cached --quiet || git commit -m "issue draft $(date +%F)"
          git push
