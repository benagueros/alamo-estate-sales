# Comp check — Alamo Estate Deals
#
# Manual dispatch: Actions -> "Comp check" -> Run workflow.
# Ben adds this file via the GitHub web UI (the GitHub integration cannot
# push .github/workflows/** files).
#
# Required repo secret: TRAWL_API_KEY (the trawl.dev key).
# Repo files: comps.py, finds.json (one entry per newsletter find).

name: Comp check

on:
  workflow_dispatch:
    inputs:
      finds_file:
        description: "Finds file in the repo (default finds.json)"
        required: false
        default: "finds.json"
      verify:
        description: "Run sold-state verification (/item per comp, ~1 credit each, max 10)"
        required: false
        default: "true"

jobs:
  comps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch sold comps
        env:
          TRAWL_API_KEY: ${{ secrets.TRAWL_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.verify }}" = "true" ]; then ARGS="--verify"; fi
          python3 comps.py "${{ inputs.finds_file }}" $ARGS --out out

      - name: Record credits spent
        # Comp-check runs are manual, but they spend real trawl credits —
        # without this step the monthly guard (state.json) would undercount
        # and the daily build could overshoot the 250 free cap. Same snippet
        # as build-issue.yml. Runs even if comp-fetch failed (if: always)
        # so partial spend is still recorded.
        # Push retry: a failed push does NOT self-heal ("next run
        # reconciles" was false — the next run starts from the old state,
        # so failed credits are silently lost). Retry once with rebase;
        # if that fails, fail loudly so the loss is visible.
        if: always()
        run: |
          python3 - <<'EOF'
          import json, datetime, os
          month = datetime.date.today().strftime("%Y-%m")
          try:
              state = json.load(open("state.json"))
          except (FileNotFoundError, json.JSONDecodeError):
              state = {}
          if state.get("trawl_month") != month:
              state = {"trawl_month": month, "trawl_credits_used": 0}
          try:
              brief = json.load(open("out/comp-brief.json"))
              spent = brief.get("credits_charged", 0)
          except (FileNotFoundError, json.JSONDecodeError):
              # Brief missing: either fetch never ran (0 credits, fine) or
              # fetch crashed mid-run after spending credits (those credits
              # are now UNACCOUNTED — the guard will undercount). This is a
              # known gap: comps.py does not write the brief incrementally.
              # Loud warning so the undercount is visible, not silent.
              spent = 0
              print("WARNING: no comp-brief found — recording 0 credits. "
                    "If comp-fetch crashed after spending credits, those "
                    "credits are unaccounted for in the monthly guard.")
          state["trawl_credits_used"] += spent
          json.dump(state, open("state.json", "w"), indent=2)
          print(f"comp-check spent {spent} credits; "
                f"month total now: {state['trawl_credits_used']}")
          EOF
          git config user.name "alamo-bot"
          git config user.email "alamo-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "comp-check: record trawl credits"
          git push || (git pull --rebase && git push) || {
            echo "ERROR: state push failed after rebase retry — "
            echo "credits recorded locally but NOT persisted. Re-run or push manually."
            exit 1
          }

      - name: Upload brief
        uses: actions/upload-artifact@v4
        with:
          name: comp-brief
          path: |
            out/comp-brief.json
            out/comp-brief.md

      - name: Brief summary
        run: cat out/comp-brief.md >> "$GITHUB_STEP_SUMMARY"
